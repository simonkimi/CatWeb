name: catweb
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ui
  flutter_rating_bar: ^4.0.1
  flutter_linkify: ^6.0.0
  flutter_highlight: ^0.7.0
  cupertino_icons: ^1.0.9
  flutter_swipe_action_cell: ^3.1.9
  extended_image: ^10.1.0
  cupertino_modal_sheet: ^1.1.0
  bot_toast: ^4.1.3
  scrollable_positioned_list: ^0.3.8
  photo_view: ^0.15.0

#  pull_to_refresh:
#    git: https://github.com/miquelbeltran/flutter_pulltorefresh
  pull_to_refresh_flutter3: ^2.0.2

  # network
  brotli: ^0.6.0
  dio: ^5.10.0
  dio_cache_interceptor: ^4.0.7
  http_cache_drift_store: ^7.0.1
  dio_smart_retry: ^7.0.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.4.0
  dio_http_formatter: ^3.3.1

  flutter_inappwebview: ^6.2.0-beta.3

  # state
  flutter_hooks: ^0.21.3+1
  get_it: ^9.2.1
  provider: ^6.1.5+1


  # database
  drift: ^2.34.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1

  # tools
  intl: 0.20.3
  synchronized: ^3.4.1+1
  uuid: ^4.6.0
  rxdart: ^0.28.0
  logger: ^2.7.0
  yaml: ^3.1.3
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  collection: ^1.19.1
  rust_lib_catweb:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  build_runner: 2.15.1
  test: ^1.31.0



flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/svgs/
