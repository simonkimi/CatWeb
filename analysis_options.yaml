include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - '**/*.g.dart'
    - '**/*.pb.dart'
    - '**/*.pbenum.dart'
    - '**/*.pbjson.dart'
    - '**/*.h.dart'
    - 'lib/gen/*.dart'
    - '**/*.mocks.dart'
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**


linter:
  rules:
    avoid_print: false
    prefer_single_quotes: true
    use_build_context_synchronously: false
