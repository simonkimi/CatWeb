[package]
name = "rust_lib_catweb"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0.229", features = ["derive"] }
xmloxide = { git = "https://github.com/simonkimi/xmloxide.git", branch = "feature/html-serialize" }
thiserror = "2.0.21"
boa_engine = { version = "0.22.0", features = ["jsvalue-enum"] }
regex = "1.13.2"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
